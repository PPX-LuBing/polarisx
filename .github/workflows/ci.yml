name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: 格式与静态检查
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: 构建
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o polarisx .
      - name: 测试（含与 Python 版的 parity 夹具）
        run: go test ./... -v
